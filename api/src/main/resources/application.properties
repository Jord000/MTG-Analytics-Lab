spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.application.name=lab-api

# OpenSearch
opensearch.host=${OPENSEARCH_HOST:localhost}
opensearch.port=${OPENSEARCH_PORT:9200}
opensearch.scheme=${OPENSEARCH_SCHEME:http}
opensearch.username=${OPENSEARCH_USERNAME:admin}
opensearch.password=${OPENSEARCH_PASSWORD:MyStrongPassword123!}

# Game Service
game-service.mtg-game-entries-index-name=${GAME_SERVICE_MTG_GAME_ENTRIES_INDEX_NAME:mtg-game-entries}
game-service.most-recent-entry-amount=${GAME_SERVICE_MOST_RECENT_ENTRY_AMOUNT:50}