# Docker compose to create the following services
#  OpenSearch
#  Dashboards
#  Seed & index creation
#  Dashboard Import Job
#  MTG Java Game API
#  Python real time game data simulator

services:
  # open search index for game storage
  opensearch:
    image: opensearchproject/opensearch:latest
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=MyStrongPassword123!
      - plugins.security.ssl.http.enabled=false
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  # opensearch dashboards for analytics
  dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=MyStrongPassword123!
      - OPENSEARCH_SECURITY_DASHBOARDS_ADMIN_USERNAME=admin
      - OPENSEARCH_SECURITY_DASHBOARDS_ADMIN_PASSWORD=MyStrongPassword123!
    ports:
      - "5601:5601"

  # seed the opensearch with base data and setup the index
  opensearch-seed:
    image: curlimages/curl:latest
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
      - ./seed:/seed
    entrypoint: ["/bin/sh", "opensearch/seed/local_seed.sh"]

  # deploy default opensearch dashboard visualisations
  dashboard-bootstrap:
    hostname: dashboard-bootstrap
    image: curlimages/curl:8.7.1
    depends_on:
      dashboards:
        condition: service_started
    volumes:
      - ./dashboards:/dashboards
    entrypoint: ["/bin/sh", "opensearch/dashboards/bootstrap.sh"]

  # java core game api for communication to the elastic search engine
  game-api:
    build:
      context: ./game-api
    ports:
      - "8080:8080"
    environment:
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: 9200
      OPENSEARCH_SCHEME: http
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: MyStrongPassword123!
      GAME_SERVICE_MTG_GAME_ENTRIES_INDEX_NAME: mtg-game-entries
      GAME_SERVICE_MOST_RECENT_ENTRY_AMOUNT: 50
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10

  simulator:
    build:
      context: ./simulator
    environment:
      GAME_API_URL: http://game-api:8080
      POST_INTERVAL_SECONDS: 5
    depends_on:
      game-api:
        condition: service_healthy

volumes:
  opensearch-data:
